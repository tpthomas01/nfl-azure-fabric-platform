# CI/CD for the infrastructure in infra/
# Stage 1 (Validate): compile the Bicep and run what-if to preview changes.
# Stage 2 (Deploy):   deploy to dev, only from main, after an approval on the nfl-dev environment.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'sc-nfl-lab'   # service connection, workload identity federation
  resourceGroup: 'rg-nfl-lab-dev'
  paramFile: 'infra/main.dev.bicepparam'

stages:
  - stage: Validate
    displayName: Validate (build + what-if)
    jobs:
      - job: WhatIf
        steps:
          - task: AzureCLI@2
            displayName: Bicep build and what-if
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e
                az bicep install
                az bicep build --file infra/main.bicep
                az deployment group what-if \
                  --resource-group $(resourceGroup) \
                  --parameters $(paramFile)

  - stage: Deploy
    displayName: Deploy to dev
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDev
        environment: nfl-dev   # has an approval check
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: Deploy Bicep
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      az bicep install
                      az deployment group create \
                        --resource-group $(resourceGroup) \
                        --name nfl-lab-$(Build.BuildId) \
                        --parameters $(paramFile)
