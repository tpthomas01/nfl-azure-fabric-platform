# NFL Azure Lab - CI/CD for infrastructure (Windows self-hosted agent version)
# Stage 1 (Validate): compile the Bicep and run what-if to preview changes.
# Stage 2 (Deploy):   deploy to dev, only from main, through an environment you can put an approval on.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*

pool:
  name: Default   # your self-hosted agent pool

variables:
  azureServiceConnection: 'sc-nfl-lab'   # name of the service connection you create in Lab 2
  resourceGroup: 'rg-nfl-lab-dev'
  paramFile: 'infra/main.dev.bicepparam'

stages:
  - stage: Validate
    displayName: Validate (build + what-if)
    jobs:
      - job: WhatIf
        steps:
          - task: AzureCLI@2
            displayName: Bicep build and what-if
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                az bicep install
                az bicep build --file infra/main.bicep
                az deployment group what-if --resource-group $(resourceGroup) --parameters $(paramFile)
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  - stage: Deploy
    displayName: Deploy to dev
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDev
        environment: nfl-dev   # created automatically on first run; add an approval check to it later
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: Deploy Bicep
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: ps
                    scriptLocation: inlineScript
                    inlineScript: |
                      az bicep install
                      az deployment group create --resource-group $(resourceGroup) --name nfl-lab-$(Build.BuildId) --parameters $(paramFile)
                      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
